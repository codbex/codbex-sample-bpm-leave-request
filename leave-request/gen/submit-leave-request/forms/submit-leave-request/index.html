<!DOCTYPE HTML>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" ng-app="forms" ng-controller="FormController">

	<head>
		<meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" sizes="any" href="data:;base64,iVBORw0KGgo=">
		<title config-title></title>
		<script type="text/javascript" src="view.js"></script>
		<script type="text/javascript" src="/services/js/platform-core/services/loader.js?id=view-js"></script>
		<link type="text/css" rel="stylesheet" href="/services/js/platform-core/services/loader.js?id=view-css" />
		<script type="text/javascript" src="controller.js"></script>
	</head>

	<body class="bk-vbox">
		<bk-fieldset class="fd-margin--tiny" ng-form="forms.form">
			<bk-form-group>

				<h1 bk-title header-size="1">{{ 'leave-request:submit-leave-request-form.t.Submitnewleaverequest' | t:'Submit new leave request' }}</h1>
				<bk-form-item horizontal="false">
					<bk-form-label colon="true" ng-required="true" for="fromId">{{ 'leave-request:submit-leave-request-form.t.From' | t:'From' }}</bk-form-label>
					<bk-input id="fromId" name="fromId" compact="false" ng-model="model.fromDate" ng-required="true" type="date"></bk-input>
				</bk-form-item>
				<bk-form-item horizontal="false">
					<bk-form-label colon="true" ng-required="true" for="toId">{{ 'leave-request:submit-leave-request-form.t.To' | t:'To' }}</bk-form-label>
					<bk-input id="toId" name="toId" compact="false" ng-model="model.toDate" ng-required="true" type="date"></bk-input>
				</bk-form-item>
				<div>
					<bk-button class="bk-full-width" type="submit" ng-disabled="!forms.form.$valid" label="{{ 'leave-request:submit-leave-request-form.t.Submit' | t:'Submit' }}" compact="false" state="emphasized" ng-click="onSubmitClicked()"></bk-button>
				</div>
			</bk-form-group>
		</bk-fieldset>
		<theme></theme>
	</body>

</html>
